# cargo-mutants configuration, read by scripts/mutants.sh and by any
# `cargo mutants` run from the repository root.
#
# Mutation testing changes the code one small way at a time (a `<` becomes
# `<=`, a function returns `Default::default()`, a `&&` becomes `||`) and
# runs the tests. A mutant the tests still pass is a "missed" mutant: a
# change in behaviour no test notices. It is a report, never a gate:
# docs/adr/0007-ci-is-the-only-gate.md.
#
# Every workspace crate is mutated except the ones below, where a missed
# mutant can't point at a bug a person would meet. src-tauri is not a
# workspace member, so it is never mutated.

exclude_globs = [
    # Generates the demo vault's sample data; its output is checked by the
    # demo import test, not line by line.
    "crates/vault/demo-seed/**",
    # Builds the chat.db fixture other tests read.
    "crates/helpers/chat-db-fixture/**",
    # Stamps the build version into binaries.
    "crates/libs/build-version/**",
    # Serde request and response types with no logic of their own.
    "crates/libs/vault-api-types/**",
]

# Text meant for people to read (Display and Debug output) changes without
# changing behaviour, so a missed mutant there is noise.
exclude_re = [
    "impl .*Display for",
    "impl .*Debug for",
]

# A mutant that turns a loop infinite is stopped at this multiple of the
# unmutated test time and counted as a timeout, not a miss.
timeout_multiplier = 3.0

# Mutants are built in a copy of the tree. Leave out what .gitignore lists,
# above all other worktrees' target/ folders under .claude/worktrees/.
gitignore = true
