# cargo-mutants configuration, read by scripts/mutants.sh and by any
# `cargo mutants` run from the repository root.
#
# Mutation testing changes the code one small way at a time (a `<` becomes
# `<=`, a function returns `Default::default()`, a `&&` becomes `||`) and
# runs the tests. A mutant the tests still pass is a "missed" mutant: a
# change in behaviour no test notices. It is a report, never a gate:
# docs/adr/0007-ci-is-the-only-gate.md.
#
# Every workspace crate is mutated except the ones below, where a missed
# mutant can't point at a bug a person would meet. src-tauri is not a
# workspace member, so it is never mutated.

exclude_globs = [
    # Generates the demo account's sample data; its output is checked by the
    # demo import test, not line by line.
    "crates/server/demo-seed/**",
    # Builds the chat.db fixture other tests read.
    "crates/helpers/chat-db-fixture/**",
    # Stamps the build version into binaries.
    "crates/libs/build-version/**",
    # Serde request and response types with no logic of their own.
    "crates/libs/api-types/**",
    # Helpers only tests call; a missed mutant there is a helper no test
    # needs to fail, not a bug in the product.
    "**/testutil.rs",
]

# Text meant for people to read (Display and Debug output) changes without
# changing behaviour, so a missed mutant there is noise.
exclude_re = [
    "impl .*Display for",
    "impl .*Debug for",
    # Functions that only build a log, progress, or error-hint line.
    "in Verbose<'_>::(progress|errors)$",
    "value_hint",
    "announce_finish",
    "ProgressBatcher::flush_remainder",
    # Arithmetic in a top-level constant (`30 * 24 * 60 * 60`): the mutant only
    # changes the number, and a test that pins a constant to its own value
    # catches nothing. A mutant inside a function ends in ` in <function>`, so
    # this matches constants only. The constants a person would notice are
    # tested by what they do: a session's lifetime, the default upload limit.
    "replace [-+*/%] with [-+*/%]$",
    # Retry jitter read from the clock; no test can pin its value.
    "rand_factor",
]

# Run each mutant's tests with cargo-nextest, which stops at the first
# failing test. A caught mutant (most of them) then takes about half the test
# time it takes under `cargo test`, which runs the rest of the test binary
# anyway: 25 s instead of 50 s for a server mutant on four cores. A missed
# mutant runs every test either way. nextest does not run doctests, so a
# mutant only a doctest would catch shows as missed.
test_tool = "nextest"

# A mutant that turns a loop infinite is stopped at this multiple of the
# unmutated test time and counted as a timeout, not a miss.
timeout_multiplier = 3.0

# Mutants are built in a copy of the tree. Leave out what .gitignore lists,
# above all other worktrees' target/ folders under .claude/worktrees/.
gitignore = true
