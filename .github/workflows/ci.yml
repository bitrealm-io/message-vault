name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    # Tag pushes still run (path filters do not apply to tags). Skip the
    # full Rust workspace on docs-only / markdown-only commits to main.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - "LICENSE*"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - "LICENSE*"
      - ".gitignore"
  workflow_dispatch:

# A new push to the same branch cancels the previous run. That stops
# queued Rust jobs from sitting until the 6-hour default timeout.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write
  packages: write

jobs:
  # ── Always: rustfmt ───────────────────────────────────────────────────
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

  # ── Always: build + test ──────────────────────────────────────────────
  test:
    name: Build & Test (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build workspace
        run: cargo build --workspace

      - name: Test workspace
        run: cargo test --workspace

  # ── Always: Postgres-gated server tests ───────────────────────────────
  # Runs the search-parity and FTS suites against a real Postgres 16 service
  # (the gated tests skip themselves unless MV_TEST_POSTGRES_URL is set).
  test-postgres:
    name: Build & Test (Rust, Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
          POSTGRES_DB: vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vault"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Job runs on the Ubuntu VM, not in a job container. GitHub publishes
      # service ports on localhost. The hostname `postgres` only resolves when
      # the job itself is a container on the same Docker network.
      - name: Test message-vault-server against Postgres
        env:
          MV_TEST_POSTGRES_URL: postgres://vault:vault@127.0.0.1:5432/vault
        run: cargo test -p message-vault-server

  # ── Always: cargo-deny advisories ─────────────────────────────────────
  deny:
    name: cargo-deny (advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  # ── Always: check, lint, and test src-tauri ───────────────────────────
  # src-tauri is not a workspace member, so the workspace build above skips
  # it; this is its compile, lint, and test gate. Same system packages as
  # the release job's Linux installer build.
  check-tauri:
    name: Check, lint, and test (src-tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-src-tauri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-src-tauri-

      - name: Check src-tauri
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Clippy src-tauri
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test src-tauri
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ── Always: web Biome (lint + format) + TypeScript ────────────────────
  web-lint:
    name: Lint (web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Lint, format-check, and type-check web frontend
        run: |
          cd web
          npm ci
          npx biome ci .
          npx tsc --noEmit

  # ── Always: web Vitest ────────────────────────────────────────────────
  web-test:
    name: Test (web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test web frontend
        run: |
          cd web
          npm ci
          npm test

  # ── Always: npm audit (web + docs) ────────────────────────────────────
  npm-audit:
    name: Audit npm deps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            docs/package-lock.json

      - name: Audit web frontend
        run: |
          cd web
          npm ci
          npm audit --audit-level=high

      - name: Audit docs site
        run: |
          cd docs
          npm ci
          npm audit --audit-level=high

  # ── Always: license consistency ───────────────────────────────────────
  license:
    name: License consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check license metadata agrees on the Fair Core License
        run: ./scripts/check-license.sh

  # ── Always: release Dockerfile copies [patch.crates-io] path crates ──
  docker-context:
    name: Docker rust-builder context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check Docker rust-builder copies patched crates
        run: ./scripts/check-docker-context.sh

  # ── Tag only: Docker image → DockerHub ────────────────────────────────
  docker:
    name: Docker image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, test, test-postgres, check-tauri]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: bitrealm/message-vault
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build stamp
        id: stamp
        run: |
          echo "build_id=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ID=${{ steps.stamp.outputs.build_id }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Tag only: Tauri desktop app → GitHub Release ──────────────────────
  release:
    name: Desktop App (${{ matrix.label }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, test, test-postgres, check-tauri]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    # Installers ship unsigned for now: no signing or notarization step
    # exists in this job. Tracked in issue #144.
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Install Linux Tauri build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        run: cargo tauri build

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BUNDLE_DIR="src-tauri/target/release/bundle"
          VERSION="${GITHUB_REF_NAME#v}"

          case "${{ matrix.os }}" in
            ubuntu-latest)
              shopt -s nullglob
              debs=("$BUNDLE_DIR"/deb/*.deb)
              appimages=("$BUNDLE_DIR"/appimage/*.AppImage)
              if [[ ${#debs[@]} -eq 0 || ${#appimages[@]} -eq 0 ]]; then
                echo "Linux build must produce both a .deb and an AppImage" >&2
                ls -R "$BUNDLE_DIR" || true
                exit 1
              fi
              cp "${debs[0]}" "dist/message-vault-io_${VERSION}_amd64.deb"
              cp "${appimages[0]}" "dist/message-vault-io_${VERSION}_amd64.AppImage"
              ;;
            windows-latest)
              cp "$BUNDLE_DIR"/msi/*.msi "dist/message-vault-io_${VERSION}_x64.msi" 2>/dev/null || \
              { echo "No Windows MSI found"; ls -R "$BUNDLE_DIR" || true; exit 1; }
              ;;
            macos-latest)
              cp "$BUNDLE_DIR"/dmg/*.dmg "dist/message-vault-io_${VERSION}_aarch64.dmg" 2>/dev/null || \
              { echo "No macOS DMG found"; ls -R "$BUNDLE_DIR" || true; exit 1; }
              ;;
          esac
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  # ── Tag only: create GitHub Release with all artifacts ─────────────────
  github-release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          pattern: package-*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "no release artifacts found under dist/" >&2
            exit 1
          fi
          echo "Release assets:"
          ls -la dist/

          gh release create "$TAG" "${assets[@]}" \
            --title "Message Vault ${TAG}" \
            --notes "## Highlights

          - Tauri v2 desktop app with all exporters included
          - Vault push/pull, format conversion, contacts preview
          - Vault server Docker image: \`bitrealm/message-vault:${TAG}\`
          - User Guide and developer docs: https://bitrealm.io/vault/user/ and https://bitrealm.io/vault/developer/

          ## Installers

          - \`message-vault-io_*.deb\` — Debian/Ubuntu
          - \`message-vault-io_*.AppImage\` — Linux (portable)
          - \`message-vault-io_*.msi\` — Windows
          - \`message-vault-io_*.dmg\` — macOS (Apple Silicon)

          ## Docker

          \`\`\`bash
          docker pull bitrealm/message-vault:${TAG}
          \`\`\`"
