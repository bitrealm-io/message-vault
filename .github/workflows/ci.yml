name: CI

# Every job runs on every pull request and reports a result, so all of them
# can be required by the ruleset on main. Path filtering happens inside the
# workflow (the `changes` job), not on the trigger: a workflow that never
# starts reports nothing, and a required check that never reports holds the
# pull request pending forever. A job skipped by its `if:` counts as passed.
# Why: docs/adr/0007-ci-is-the-only-gate.md.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels its previous run, so queued Rust
# jobs do not sit until the 6-hour default timeout on a branch nobody is
# waiting for any more. Pushes to main and tags are never cancelled: the
# ruleset checks each pull request against the main it branched from, not
# the main it lands on, so two green pull requests can merge into a red
# main. The run on each main commit is the only thing that reports that,
# and it has to finish to do so.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job reads the repository and nothing else. The one job that writes,
# github-release, asks for contents: write on its own. The Docker image goes
# to Docker Hub with its own secret, not to GitHub Packages, so no job needs
# packages: write.
permissions:
  contents: read

jobs:
  # ── Always: classify what the change touches ──────────────────────────
  # On anything but a pull request there is no base to diff against, so
  # every output is true and everything runs.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      web: ${{ steps.classify.outputs.web }}
      docs: ${{ steps.classify.outputs.docs }}
      docker: ${{ steps.classify.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "pull_request" ]]; then
            printf 'rust=true\nweb=true\ndocs=true\ndocker=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet origin "$BASE"
          rust=false web=false docs=false docker=false
          while IFS= read -r f; do
            case "$f" in
              # The committed OpenAPI document feeds the web app's generated
              # types, and the script that checks them runs in the web job,
              # so a change to either must run that job.
              docs/src/assets/openapi.json) docs=true; web=true ;;
              scripts/check-generated-api-types.sh) web=true ;;
              docs/*) docs=true ;;
              web/*) web=true ;;
              web-next/*) ;;                # legacy tree, not the product path
              # The image is built from the Dockerfile, the Cargo manifests
              # and lockfile it copies, and the toolchain pin. A change to one
              # of them is how the image stops building while the Rust jobs
              # stay green.
              docker/*|Cargo.toml|Cargo.lock|rust-toolchain.toml|config/config.docker.toml) rust=true; docker=true ;;
              crates/*/Cargo.toml|vendor/*/Cargo.toml) rust=true; docker=true ;;
              .github/workflows/*) rust=true; web=true; docs=true; docker=true ;;
              .github/*|.cursor/*|.gitignore|LICENSE*) ;;
              *.md) ;;
              *) rust=true ;;               # crates, src-tauri, vendor, schema,
            esac                            # scripts — Rust CI
          done < <(git diff --name-only "origin/$BASE...HEAD")
          printf 'rust=%s\nweb=%s\ndocs=%s\ndocker=%s\n' "$rust" "$web" "$docs" "$docker" >> "$GITHUB_OUTPUT"
          echo "rust=$rust web=$web docs=$docs docker=$docker"

  # ── Rust: rustfmt ─────────────────────────────────────────────────────
  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

  # ── Rust: Clippy on the workspace ─────────────────────────────────────
  # src-tauri Clippy lives in check-tauri, which already installs the
  # webkit/gtk system packages its build needs.
  clippy:
    name: Clippy (workspace)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── Rust: build + test on SQLite, then the server suite again on Postgres
  # The workspace runs once with MV_TEST_POSTGRES_URL unset, which is the
  # SQLite run every developer gets locally; the tests whose subject is
  # SQLite itself (the schema contract, FTS5 triggers, rebuilds) only assert
  # there. The server crate then runs a second time with the variable set:
  # its shared test pool hands every test a schema of its own on the
  # service (#339), and the SQLite-only tests return early and say so. Only
  # the server reads the variable, so nothing else needs the second pass.
  # ffmpeg is installed because the transcode, media and demo-seed tests
  # skip themselves without it, and a skipped test asserts nothing.
  test:
    name: Build & Test (Rust)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
          POSTGRES_DB: vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vault"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev ffmpeg

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build workspace
        run: cargo build --workspace

      - name: Test workspace on SQLite
        run: cargo test --workspace

      # GitHub publishes service ports on localhost; the hostname `postgres`
      # only resolves when the job itself runs in a container.
      - name: Test the server on Postgres
        env:
          MV_TEST_POSTGRES_URL: postgres://vault:vault@127.0.0.1:5432/vault
        run: cargo test -p message-vault-server

  # ── Rust: check, lint, and test src-tauri ─────────────────────────────
  # src-tauri is not a workspace member, so the workspace jobs above skip
  # it; this is its compile, lint, and test gate. Same system packages as
  # the release job's Linux installer build.
  check-tauri:
    name: Check, lint, and test (src-tauri)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-src-tauri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-src-tauri-

      - name: Check src-tauri
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Clippy src-tauri
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test src-tauri
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ── Web: lint, generated types, type-check + bundle, tests ────────────
  # `npm run build` is typecheck (both tsconfigs) plus the Vite bundle, so
  # this job catches what a release build would otherwise find first.
  web:
    name: Lint, test, and build (web)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Lint and format-check
        run: cd web && npx biome ci .

      - name: Generated vault API types match the OpenAPI document
        run: ./scripts/check-generated-api-types.sh

      - name: Type-check and build bundle
        run: cd web && npm run build

      - name: Test
        run: cd web && npm test

  # ── Docs: Astro check + build ─────────────────────────────────────────
  # The site build without rustdoc or the HTTP API catalog: both are copied
  # into public/, which `astro check` never reads and the link checker
  # excludes, so neither can change whether the site builds. cargo doc
  # failures are compile failures the test job already catches. The full
  # build with both, and the deploy, stay in docs.yml on the release tag.
  docs:
    name: Check and build (docs)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Check
        working-directory: docs
        run: npm run check

      - name: Build
        working-directory: docs
        run: npm run build

  # ── Always: license consistency ───────────────────────────────────────
  license:
    name: License consistency
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check license metadata agrees on the Fair Core License
        run: ./scripts/check-license.sh

  # ── Always: release Dockerfile copies [patch.crates-io] path crates ──
  docker-context:
    name: Docker rust-builder context
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check Docker rust-builder copies patched crates
        run: ./scripts/check-docker-context.sh

  # ── docker: the release Dockerfile builds ─────────────────────────────
  # The image used to be built for the first time on the release tag, so a
  # pull request that broke docker/Dockerfile merged green and the tag
  # failed. This job builds it without pushing whenever the Dockerfile, a
  # Cargo manifest or the lockfile changes. Pull requests only: the tag job
  # below builds and pushes the same image, and a push to main is checked
  # by the pull request that produced it.
  docker-build:
    name: Docker image builds
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Always: product version lockstep ──────────────────────────────────
  # The four version files and their lockfiles must agree; on a v* tag they
  # must also agree with the tag, and CHANGELOG.md must have a heading for it.
  version:
    name: Product version lockstep
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check the product version agrees everywhere
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: ./scripts/check-version-lockstep.sh ${TAG:+"$TAG"}

  # ── Tag only: Docker image → DockerHub ────────────────────────────────
  # On a tag the changes job reports everything true, so every job above
  # actually runs; nothing ships unless all of them are green.
  docker:
    name: Docker image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [changes, fmt, clippy, test, check-tauri, web, docs, license, docker-context, version]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: bitrealm/message-vault
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build stamp
        id: stamp
        run: |
          echo "build_id=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ID=${{ steps.stamp.outputs.build_id }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Tag only: Tauri desktop app → GitHub Release ──────────────────────
  release:
    name: Desktop App (${{ matrix.label }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [changes, fmt, clippy, test, check-tauri, web, docs, license, docker-context, version]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    # Installers ship unsigned for now: no signing or notarization step
    # exists in this job. Tracked in issue #144.
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Install Linux Tauri build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      # tauri-cli publishes cargo-binstall metadata with prebuilt archives, so
      # this downloads a binary in seconds. Compiling it from source took 5.6
      # minutes on Linux, 8.5 on macOS and 10.6 on Windows in the v0.8.3
      # release, about as long as building the app itself. The ^2 range keeps
      # the release on the major the desktop app targets.
      #
      # Download only: --strategies leaves out binstall's compile fallback, so
      # a missing archive fails this step instead of quietly compiling for ten
      # minutes. macOS needs --pkg-fmt zip because tauri-cli's metadata says
      # tgz for every target it does not override, it overrides x86_64 macOS
      # but not aarch64, and its release ships only a zip for aarch64.
      # GITHUB_TOKEN authenticates binstall's release lookup on
      # api.github.com; unauthenticated, the 60-per-hour limit is shared by
      # every runner on the same address and the lookup 403s.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.23.0

      - name: Install Tauri CLI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          cargo binstall tauri-cli --version "^2" --no-confirm
          --strategies crate-meta-data
          ${{ matrix.os == 'macos-latest' && '--pkg-fmt zip' || '' }}

      - name: Build Tauri app
        run: cargo tauri build

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BUNDLE_DIR="src-tauri/target/release/bundle"
          VERSION="${GITHUB_REF_NAME#v}"

          case "${{ matrix.os }}" in
            ubuntu-latest)
              shopt -s nullglob
              debs=("$BUNDLE_DIR"/deb/*.deb)
              appimages=("$BUNDLE_DIR"/appimage/*.AppImage)
              if [[ ${#debs[@]} -eq 0 || ${#appimages[@]} -eq 0 ]]; then
                echo "Linux build must produce both a .deb and an AppImage" >&2
                ls -R "$BUNDLE_DIR" || true
                exit 1
              fi
              cp "${debs[0]}" "dist/message-vault-io_${VERSION}_amd64.deb"
              cp "${appimages[0]}" "dist/message-vault-io_${VERSION}_amd64.AppImage"
              ;;
            windows-latest)
              cp "$BUNDLE_DIR"/msi/*.msi "dist/message-vault-io_${VERSION}_x64.msi" 2>/dev/null || \
              { echo "No Windows MSI found"; ls -R "$BUNDLE_DIR" || true; exit 1; }
              ;;
            macos-latest)
              cp "$BUNDLE_DIR"/dmg/*.dmg "dist/message-vault-io_${VERSION}_aarch64.dmg" 2>/dev/null || \
              { echo "No macOS DMG found"; ls -R "$BUNDLE_DIR" || true; exit 1; }
              ;;
          esac
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  # ── Tag only: create GitHub Release with all artifacts ─────────────────
  # The release notes tell people to `docker pull` the image, so the release
  # waits for the image push as well as the installers. A failed push means
  # no release; fix, delete the tag, and tag again.
  github-release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          pattern: package-*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "no release artifacts found under dist/" >&2
            exit 1
          fi
          echo "Release assets:"
          ls -la dist/

          gh release create "$TAG" "${assets[@]}" \
            --title "Message Vault ${TAG}" \
            --notes "## Highlights

          - Tauri v2 desktop app with all exporters included
          - Vault push/pull, format conversion, contacts preview
          - Vault server Docker image: \`bitrealm/message-vault:${TAG}\`
          - User Guide and developer docs: https://bitrealm.io/vault/user/ and https://bitrealm.io/vault/developer/

          ## Installers

          - \`message-vault-io_*.deb\` — Debian/Ubuntu
          - \`message-vault-io_*.AppImage\` — Linux (portable)
          - \`message-vault-io_*.msi\` — Windows
          - \`message-vault-io_*.dmg\` — macOS (Apple Silicon)

          ## Docker

          \`\`\`bash
          docker pull bitrealm/message-vault:${TAG}
          \`\`\`"
