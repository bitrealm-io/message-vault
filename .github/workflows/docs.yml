name: Docs

# The site at messagecrate.app describes the released product, so it publishes
# when a release ships: the same `v*` tag push that builds the image and the
# installers in ci.yml. A merge to main does not publish; the `docs` job in
# ci.yml already checks and builds the site on every pull request that
# touches docs/, so nothing broken reaches the tag. `workflow_dispatch` is
# the override for a docs-only correction between releases.
# Why: docs/adr/0007-ci-is-the-only-gate.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One group for every deploy, never cancelled: a second tag or a manual run
# queues behind the one in flight instead of cancelling a production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-docs-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build rustdoc
        run: cargo doc --workspace --no-deps

      - name: Copy rustdoc into the docs site
        run: |
          rm -rf docs/public/docs/developer/rustdoc
          mkdir -p docs/public/docs/developer
          cp -a target/doc docs/public/docs/developer/rustdoc
          if [ ! -f docs/public/docs/developer/rustdoc/index.html ]; then
            printf '%s\n' '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=message_vault_server/index.html"><title>Rust crate docs</title><link rel="canonical" href="message_vault_server/index.html"></head><body><p><a href="message_vault_server/index.html">message-vault-server crate docs</a></p></body></html>' > docs/public/docs/developer/rustdoc/index.html
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Copy HTTP API catalog into rustdoc
        run: bash docs/scripts/copy-http-api-reference.sh

      - name: Check
        working-directory: docs
        run: npm run check

      - name: Build
        working-directory: docs
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
