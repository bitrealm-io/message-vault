# Container defaults for Docker Compose (dev + release profiles).
# Entrypoints copy this to config/config.toml when missing, and restore it
# after `reset-demo` (which otherwise installs the demo config without [server]).

[paths]
db = "data/messagecrate.db"
data_dir = "data"
assets_dir = "assets"
assets_converted_dir = "assets_converted"

# Bind all interfaces so Docker port publishing works.
# Compose publishes 0.0.0.0:3000/8080 for LAN access; restrict with the host
# firewall to your trusted subnet (do not port-forward on the router).
[server]
bind = "0.0.0.0:8080"

# UI origins that call this API on a different host/port. Without this list the
# desktop app reports it cannot reach the server even when curl to :8080 works.
# - Vite / `cargo tauri dev`: :5173
# - Packaged desktop: tauri://localhost (Linux AppImage / macOS),
#   http://tauri.localhost (Windows), https://tauri.localhost (Windows HTTPS scheme)
cors_origins = [
  "http://localhost:5173",
  "http://127.0.0.1:5173",
  "https://tauri.localhost",
  "http://tauri.localhost",
  "tauri://localhost",
]
