[package]
name = "imazing-exporter"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FCL-1.0-ALv2"
description = "Convert iMazing Messages / WhatsApp CSV (+ vCard CSV / VCF contacts) to shared per-chat CSV"
autotests = false

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
csv = "1.4.0"
contacts = { path = "../../libs/contacts" }
message-csv = { path = "../../libs/csv" }
message-vault-io-core = { path = "../../core/message-vault-io-core" }
message-ir = { path = "../../libs/ir" }
message-ir-format = { path = "../../libs/ir-format" }
media = { path = "../../libs/media" }
phone = { path = "../../libs/phone" }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
