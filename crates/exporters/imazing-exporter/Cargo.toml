[package]
name = "imazing-exporter"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FCL-1.0-ALv2"
description = "Convert iMazing Messages / WhatsApp CSV to shared per-chat CSV"
autotests = false

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
message-csv = { path = "../../libs/csv" }
message-crate-core = { path = "../../core/message-crate-core" }
message-ir = { path = "../../libs/ir" }
message-ir-format = { path = "../../libs/ir-format" }
message-staging = { path = "../../libs/staging" }
media = { path = "../../libs/media" }
phone = { path = "../../libs/phone" }
serde_json = { workspace = true }

[dev-dependencies]
message-crate-core = { path = "../../core/message-crate-core", features = ["testutil"] }
tempfile = { workspace = true }

[lints]
workspace = true
