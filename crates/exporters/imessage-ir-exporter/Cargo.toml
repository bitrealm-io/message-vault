[package]
name = "imessage-ir-exporter"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FCL-1.0-ALv2"
description = "Export Apple Messages to per-conversation JSON Lines / JSON / CSV / EML / MBOX via message-ir, reading the database through the imessage-reader helper process"
repository = "https://github.com/messagecrate/message-crate"

[lib]
name = "imessage_ir_exporter"
path = "src/lib.rs"

# No GPL code here. Reading chat.db is the job of the `imessage-reader`
# program (crates/helpers/imessage-reader, GPL-3.0-or-later), which this crate
# starts as a separate process. The two share only the wire types in
# `imessage-reader-protocol` (MIT OR Apache-2.0).
# Why: docs/adr/0014-gpl-code-only-behind-a-process-boundary.md.
[dependencies]
anyhow = { workspace = true }
imessage-reader-protocol = { path = "../../helpers/imessage-reader-protocol" }
ios-backup = { path = "../../libs/ios-backup" }
message-crate-core = { path = "../../core/message-crate-core" }
message-ir = { path = "../../libs/ir" }
message-ir-format = { path = "../../libs/ir-format" }
message-staging = { path = "../../libs/staging" }
serde_json = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
chat-db-fixture = { path = "../../helpers/chat-db-fixture" }
ios-backup = { path = "../../libs/ios-backup", features = ["testutil"] }
serde_json = { workspace = true }

[lints]
workspace = true
