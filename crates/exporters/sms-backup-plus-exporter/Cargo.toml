[package]
name = "sms-backup-plus-exporter"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FCL-1.0-ALv2"
autotests = false

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
hex = { workspace = true }
mail = { path = "../../libs/mail" }
mail-builder = "1.0.0"
mailparse = "0.17.0"
message-crate-core = { path = "../../core/message-crate-core" }
message-ir = { path = "../../libs/ir" }
mms-parts = { path = "../../libs/mms-parts" }
message-ir-format = { path = "../../libs/ir-format" }
message-staging = { path = "../../libs/staging" }
media = { path = "../../libs/media" }
phone = { path = "../../libs/phone" }
rayon = "1.12.0"
regex = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
message-crate-core = { path = "../../core/message-crate-core", features = ["testutil"] }
message-ir = { path = "../../libs/ir", features = ["testutil"] }
tempfile = { workspace = true }

[lints]
workspace = true
