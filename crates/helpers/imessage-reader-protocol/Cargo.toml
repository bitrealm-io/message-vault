[package]
name = "imessage-reader-protocol"
version = "0.1.0"
edition = "2024"
# Permissive on purpose. Both the GPL helper (`imessage-reader`) and the FCL
# exporter (`imessage-ir-exporter`) link this crate, so it can carry neither
# licence: GPL code may not absorb FCL terms and FCL code may not absorb GPL
# terms. The wire types are the only thing the two sides share.
license = "MIT OR Apache-2.0"
description = "Line-delimited JSON protocol between the Message Vault desktop app and the imessage-reader helper process"
repository = "https://github.com/bitrealm-io/message-vault"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
