[package]
name = "message-ir-format"
version = "0.1.0"
edition = "2024"
description = "FormatSink, readers/writers, and transforms for message-ir ConversationDocument"
license = "LicenseRef-FCL-1.0-ALv2"

[dependencies]
anyhow = { workspace = true }
contacts = { path = "../contacts" }
csv = "1.4.0"
fs2 = "0.4.3"
message-csv = { path = "../csv" }
message-vault-io-core = { path = "../../core/message-vault-io-core" }
message-ir = { path = "../ir" }
mail = { path = "../mail" }
media = { path = "../media" }
obfuscate = { path = "../obfuscate" }
phone = { path = "../phone" }
sbr = { path = "../sbr" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
message-ir = { path = "../ir", features = ["testutil"] }
sha2 = { workspace = true }
tempfile = { workspace = true }
