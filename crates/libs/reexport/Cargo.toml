[package]
name = "message-reexport"
version = "0.1.0"
edition = "2024"
description = "Convert a Message Crate output directory to another format"
license = "LicenseRef-FCL-1.0-ALv2"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
message-crate-core = { path = "../../core/message-crate-core" }
message-ir = { path = "../ir" }
message-ir-format = { path = "../ir-format" }
message-staging = { path = "../staging" }
media = { path = "../media" }
serde_json = { workspace = true }
sms-backup-plus-exporter = { path = "../../exporters/sms-backup-plus-exporter" }
sms-backup-restore-exporter = { path = "../../exporters/sms-backup-restore-exporter" }

[dev-dependencies]
media = { path = "../media", features = ["testutil"] }
message-ir = { path = "../ir", features = ["testutil"] }
tempfile = { workspace = true }

[lints]
workspace = true
