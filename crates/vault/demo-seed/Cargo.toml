[package]
name = "demo-seed"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FCL-1.0-ALv2"

[lib]
name = "demo_seed"
path = "src/lib.rs"

[[bin]]
name = "demo-seed"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { version = "4.6.1", features = ["derive"] }
hex = { workspace = true }
message-ir = { workspace = true }
sha2 = { workspace = true }
rand = "0.10.2"
rand_chacha = "0.10.0"
rand_distr = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tempfile = { workspace = true }
