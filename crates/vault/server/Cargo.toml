[package]
name = "message-vault-server"
version = "0.8.3"
edition = "2024"
license = "LicenseRef-FCL-1.0-ALv2"

[dependencies]
anyhow = { workspace = true }
argon2 = "0.6.0"
axum = "0.8.9"
chrono = { workspace = true }
chrono-tz = "0.10"
clap = { version = "4.6.1", features = ["derive"] }
clap-markdown = "0.1.5"
contacts = { workspace = true }
demo-seed = { path = "../demo-seed" }
fs2 = "0.4.3"
futures-util = { version = "0.3.31", default-features = false }
libc = "0.2"
media = { path = "../../libs/media" }
message-ir = { workspace = true }
message-ir-format = { path = "../../libs/ir-format" }
phone = { workspace = true }
rand = "0.10.2"
rayon = "1.12.0"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "sqlite", "postgres", "tls-rustls"] }
tempfile = { workspace = true }
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = { workspace = true }
tower-http = { version = "0.7.0", features = ["limit", "cors", "fs"] }
uuid = { version = "1.18.1", features = ["v4"] }
vault-api-types = { path = "../../libs/vault-api-types", features = ["schema"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[dev-dependencies]
reqwest = { workspace = true }
