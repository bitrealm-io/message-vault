# Dev-only Postgres for the server's Postgres engine path and the
# MC_TEST_POSTGRES_URL-gated test suite.
#
#   docker compose -f docker-compose.pg.yml up -d
#   MC_TEST_POSTGRES_URL=postgres://messagecrate:messagecrate@127.0.0.1:5432/messagecrate \
#     cargo test -p message-crate-server
#
# Data lives in the named volume messagecrate_pg_data. `down -v` deletes it.
#
# Own project name so this file does not share containers or the
# message-crate_default network with docker/compose.yml (also named
# message-crate) or leftover services from deleted compose files.
name: message-crate-pg

services:
  postgres:
    image: postgres:16-alpine
    # Docker defaults /dev/shm to 64mb. Parallel VACUUM after --reset-demo
    # needs ~64mb per worker (up to ~192mb). 512mb leaves a little extra.
    shm_size: 512mb
    environment:
      POSTGRES_USER: messagecrate
      POSTGRES_PASSWORD: messagecrate
      POSTGRES_DB: messagecrate
    ports: ["5432:5432"]
    volumes:
      - messagecrate_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messagecrate"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  messagecrate_pg_data:
    name: messagecrate_pg_data
