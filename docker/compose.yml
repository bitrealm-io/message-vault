# Published Message Crate image. Save this file and run: docker compose up -d
# Docs: https://messagecrate.app/docs/user/get-started/try-message-crate/
#
# Pin a release: change :latest to :0.8.3 (no "v").
# Empty Message Crate: DEMO_DATA=false docker compose up -d
# JSONL drop: copy files into ./staging

name: message-crate

services:
  server:
    image: bitrealm/message-crate:latest
    user: "${UID}:${GID}"
    ports:
      - "8080:8080"
    environment:
      DEMO_DATA: ${DEMO_DATA:-true}
    volumes:
      - message-crate-data:/app/data
      - ./staging:/app/staging
    restart: unless-stopped

volumes:
  message-crate-data:
    name: message-crate-data
